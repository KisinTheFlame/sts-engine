name: Release

# 合并到 master 后自动发版：
# 读取 package.json 的 version，若对应的 v<version> tag 还不存在，
# 就跑测试 → 发布 npm → 打 tag → 建 GitHub Release。
# 版本号在功能 PR 里 bump，合并即发布，无需手动打 tag。
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # 打 tag、建 Release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "已存在 tag v${{ steps.v.outputs.version }}，跳过发布。"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "新版本 v${{ steps.v.outputs.version }}，开始发布。"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.exists == 'false'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.exists == 'false'

      # ⚠⚠ 同 ci.yml：这里原先挂着的 `NODE_OPTIONS=--max-old-space-size=3072` 与
      #   `test:ci` 的 `--maxWorkers=1` 理由都已被证伪（真因是 `forks` 池的 IPC，
      #   不是内存；并发也不是变量——拆分前 4 worker 2.70GB / 1 worker 2.73GB），
      #   第四十八批一并删掉。完整的墓志铭与实测数字见 ci.yml 同一格。
      # ⚠ `--reporter=dot` 保留但已不再承重，只是让日志短一点。
      # ⚠ 过滤掉 dot reporter 的进度点。不过滤的话失败时 GitHub 日志里全是「·」，
      # 真正的报错被冲掉——这个坑连续误导了三轮排查（每次都以为是内存）。
      # `pipefail` 保证退出码来自 vitest 而不是 sed。
      - name: pnpm test:ci
        shell: bash
        run: |
          set -o pipefail
          pnpm test:ci 2>&1 | sed 's/·//g' | grep -vE '^[[:space:]]*$'
        if: steps.check.outputs.exists == 'false'

      # trusted publishing（OIDC）的 registry 鉴权是 npm CLI（>= 11.5.1）
      # 的能力，pnpm 自带的 publish 不做这步 token 交换，故改用 npm。
      # 前提：npmjs.com 的包 Settings → Trusted Publishing 里已绑定
      # 仓库 KisinTheFlame/sts-engine + workflow release.yml。不需要 NPM_TOKEN。
      - name: Upgrade npm (OIDC trusted publishing 需要 >= 11.5.1)
        if: steps.check.outputs.exists == 'false'
        run: npm install -g npm@latest

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --access public --provenance

      - name: Create tag and GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"
          gh release create "v${{ steps.v.outputs.version }}" \
            --title "v${{ steps.v.outputs.version }}" \
            --generate-notes
