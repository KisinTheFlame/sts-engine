name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      # ⚠⚠ **这一格曾经挂着 `NODE_OPTIONS=--max-old-space-size=3072` 与 `--maxWorkers=1`，
      #   两者的理由都已被证伪，第四十八批一并删掉。** 留个墓志铭免得有人再加回来：
      #
      #   * 当时的说法是「对拍单文件要 2.1GB 堆 ⇒ 抬高 V8 上限 + 让它独占 worker」。
      #     堆的数字是真的，因果是假的。真凶是**池**：`forks` 下 worker 要为 42586 个用例
      #     各发一次 `onTaskUpdate`，进程间 IPC 撑爆 ⇒ `Timeout calling "onTaskUpdate"`，
      #     以及 worker 被杀后主进程只看到 `ERR_IPC_CHANNEL_CLOSED`。
      #     修它的是 `vitest.config.ts` 的 `pool: "threads"`，不是这两个旋钮。
      #   * `--maxWorkers=1` 那句「4 个 worker 并发时峰值叠加」当场就能证伪：拆分前实测
      #     4 worker 峰值 RSS **2.70GB**、1 worker **2.73GB**——**并发根本不是变量**，
      #     单个文件持有全量语料才是。
      #   * 第四十八批把对拍拆成 16 片之后（见 `test/helpers/trace-slices.ts`），
      #     单片语料约 65MB，实测峰值 RSS 4 worker **1.82GB** / 1 worker **0.81GB**，
      #     两者都远低于 runner 的 16GB，**没有任何理由再压并发或钉堆上限**。
      #     真要再遇到内存压力，旋钮是 `SLICE_COUNT`（加片），不是 `--max-old-space-size`。
      #
      # ⚠ `--reporter=dot` **保留但已不再是承重墙**：上面两条真因都消除了（池换了、
      #   单文件最多 3975 个用例），它现在只是让 CI 日志短一点。要删的话连下面的 sed 一起删。
      # ⚠ 过滤掉 dot reporter 的进度点。不过滤的话失败时 GitHub 日志里全是「·」，
      # 真正的报错被冲掉——这个坑连续误导了三轮排查（每次都以为是内存）。
      # `pipefail` 保证退出码来自 vitest 而不是 sed。
      - name: pnpm test:ci
        shell: bash
        run: |
          # ⚠⚠ **不要用管道**。管道会缓冲，进程一旦被杀，缓冲区里的输出全丢——
          # GitHub 日志上只剩 `RUN v3.2.6` 一行，看起来像「死得很早」，实际可能跑到了末尾。
          # 这个坑连续吞掉了三轮排查的证据。先落盘、再打印、最后用真实退出码退出。
          set +e
          pnpm test:ci > /tmp/test.log 2>&1
          code=$?
          echo "EXIT=$code"
          echo '--- 末尾 60 行 ---'
          tail -60 /tmp/test.log
          exit $code
      - run: pnpm build
