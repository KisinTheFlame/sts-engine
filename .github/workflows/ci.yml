name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      # ⚠ CI 上跑 test:ci（--reporter=dot）而不是 test。
      # 对拍现在是单文件 42586 个用例，默认 reporter 要在主线程为每个用例维护一个任务节点，
      # CI 机器上来不及回 ack，worker 侧的 birpc 就抛
      # `[vitest-worker]: Timeout calling "onTaskUpdate"` —— 全部用例其实都通过了，
      # 红的是报告层。birpc 的超时 vitest 没有暴露成配置，所以只能减轻主线程负担。
      # 本地仍用默认 reporter：变异测试要靠它逐条读失败用例名。
      # —— 临时诊断（查清 CI 上 test:ci 被杀的真因后删掉）——
      - name: 诊断：runner 资源
        run: |
          echo "--- 内存 ---"; free -m
          echo "--- 磁盘 ---"; df -h /
          echo "--- CPU ---"; nproc
          echo "--- trace 数据 ---"; du -sh test/golden/traces
      - name: 诊断：带退出码与 GC 日志跑对拍
        run: |
          set +e
          node --max-old-space-size=3072 --trace-gc \
            node_modules/vitest/vitest.mjs run test/sts-combat-trace.test.ts --reporter=dot \
            > /tmp/out.log 2>&1
          code=$?
          echo "EXIT=$code"
          echo "--- 末尾 40 行 ---"; tail -40 /tmp/out.log
          echo "--- GC 峰值（最后 5 条）---"; grep -o "[0-9]* M) -> " /tmp/out.log | tail -5
          echo "--- 事后内存 ---"; free -m
          exit 0
      - run: pnpm test:ci
        env:
          # ⚠ 对拍会把全部 trace 一次性读进内存：982MB 的 JSONL 解析出来是 **2.1GB 堆**，
          # 超过 fork 出来的 vitest worker 的 V8 老生代默认上限 ⇒ worker 被杀、
          # 主进程只看到 ERR_IPC_CHANNEL_CLOSED，日志里**一个字的测试输出都没有**。
          # 本地用 `NODE_OPTIONS=--max-old-space-size=2048` 可稳定复现。
          # ⚠⚠ 值要**压低**不要抬高：先设 8192 时 CI 反而连挂两次（89 秒后进程被
          # SIGKILL、日志截断、一个字输出都没有）。把上限设得远高于实际需要，
          # V8 就会推迟大回收、峰值 RSS 冲上去被 OS 杀掉。实测需要 2.1GB，
          # 3072 给了足够余量又逼 V8 老实回收；本地 2048 会挂、3072/4096 都过。
          # ⚠ 这只是把天花板抬高，没有消除它——真正的解法见 TODOS「测试基础设施」。
          NODE_OPTIONS: --max-old-space-size=3072
      - run: pnpm build
